services:
  api_server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/test_db
      - JWT_SECRET=production_super_secret_key
      - PORT=8080
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: